backend:
  name: github
  repo: RicardoEPRodrigues/ricardoeprodrigues.github.io
  branch: gh-pages
  site_domain: colorcrow.me

publish_mode: editorial_workflow

media_folder: "assets/uploads" # Media files will be stored in the repo under images/uploads

collections:
  - name: 'pages'
    label: 'Pages'
    editor:
      preview: false
    files:
      - label: 'Home Page'
        name: 'home'
        file: 'index.md'
        fields:
          - { label: 'Title', name: 'title', widget: 'hidden', default: 'Home' }
          - { label: 'Layout', name: 'layout', widget: 'hidden', default: 'home' }
          - { label: 'Kicker', name: 'kicker', widget: 'string', hint: 'Small capitals above the name.' }
          - { label: 'Also known as', name: 'alias', widget: 'string', required: false }
          - { label: 'Introduction', name: 'intro', widget: 'text', hint: 'Markdown. Its first letter becomes the illuminated initial.' }
          - { label: 'Portrait caption', name: 'caption', widget: 'string', required: false }
          - label: 'Featured work'
            name: 'featured'
            widget: 'object'
            required: false
            fields:
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Link', name: 'url', widget: 'string', required: false, hint: 'A path on this site, like /portfolio/#comilito' }
              - { label: 'Image', name: 'image', widget: 'image', required: false }
              - { label: 'Image description', name: 'image_alt', widget: 'string', required: false }
              - { label: 'Meta', name: 'meta', widget: 'string', required: false, hint: 'Small capitals, e.g. Personal project · Rust' }
              - { label: 'Blurb', name: 'blurb', widget: 'text', required: false }
          - label: 'Works'
            name: 'works'
            widget: 'list'
            required: false
            summary: '{{fields.title}}'
            fields:
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Role', name: 'role', widget: 'string', required: false }
              - { label: 'Summary', name: 'summary', widget: 'string', required: false }
              - { label: 'Link', name: 'url', widget: 'string', required: false }
      - label: 'About Page'
        name: 'about'
        file: 'about.md'
        fields:
          - { label: 'Title', name: 'title', widget: 'hidden', default: 'About' }
          - { label: 'Layout', name: 'layout', widget: 'hidden', default: 'page' }
          - { label: 'Kicker', name: 'kicker', widget: 'string', required: false, hint: 'Small capitals above the title.' }
          - { label: 'Body', name: 'body', widget: 'markdown' }
      - label: 'Portfolio'
        name: 'portfolio'
        file: 'portfolio.md'
        fields:
          - { label: 'Title', name: 'title', widget: 'hidden', default: 'Portfolio' }
          - { label: 'Layout', name: 'layout', widget: 'hidden', default: 'page' }
          - { label: 'Kicker', name: 'kicker', widget: 'string', required: false, hint: 'Small capitals above the title.' }
          - { label: 'Body', name: 'body', widget: 'markdown' }
  - name: "blog" # Used in routes, e.g., /admin/collections/blog
    label: "Blog" # Used in the UI
    folder: "_posts" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
    editor:
      preview: false
    fields: # The fields for each document, usually in front matter
      - {label: "Layout", name: "layout", widget: "hidden", default: "post"}
      - {label: "Category", name: "category", widget: "hidden", default: "blog"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Description", name: "description", widget: "string"}
      - {label: "Show Header Image", name: "headerImage", widget: "boolean", required: false}
      - {label: "Header Image", name: "image", widget: "image", default: "/assets/uploads/CorvoTattoo_background.png"}
      - {label: "Tags", name: "tag", widget: "list", required: false}
      - {label: "Author", name: "author", widget: "string", default: "ricardorodrigues"}
      - {label: "External Link", name: "externalLink", widget: "string", required: false}
      - {label: "Hidden", name: "hidden", widget: "boolean", default: false, hint: "Setting hidden to true will exclude a post from pagination, but it will still be available by direct link."}
      - {label: "Published", name: "published", widget: "boolean", default: true, hint: "Setting published to false will not only hide the post but also make it unavailable (i.e. it is exclude from the site)."}
      - {label: "Body", name: "body", widget: "markdown", required: false}
  - name: "projects" # Used in routes, e.g., /admin/collections/blog
    label: "Projects" # Used in the UI
    folder: "_projects" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
    editor:
      preview: false
    fields: # The fields for each document, usually in front matter
      - {label: "Layout", name: "layout", widget: "hidden", default: "post"}
      - {label: "Category", name: "category", widget: "hidden", default: "project"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Description", name: "description", widget: "string"}
      - {label: "Show Header Image", name: "headerImage", widget: "boolean", required: false}
      - {label: "Header Image", name: "image", widget: "image", required: false}
      - {label: "Tags", name: "tag", widget: "list", required: false}
      - {label: "Author", name: "author", widget: "string", default: "ricardorodrigues"}
      - {label: "External Link", name: "externalLink", widget: "string", required: false}
      - {label: "Hidden", name: "hidden", widget: "boolean", default: false, hint: "Setting hidden to true will exclude a post from pagination, but it will still be available by direct link."}
      - {label: "Published", name: "published", widget: "boolean", default: true, hint: "Setting published to false will not only hide the post but also make it unavailable (i.e. it is exclude from the site)."}
      - {label: "Body", name: "body", widget: "markdown", required: false}

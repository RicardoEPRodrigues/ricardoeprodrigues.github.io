<footer class="site-footer">
    <div class="shell">
        <div class="site-footer__top">
            <div>
                <p class="site-footer__name">Colorcrow</p>
                {% if site.motto %}<p class="site-footer__motto">{{ site.motto }}</p>{% endif %}
            </div>
            {% include social-links.html feed=true %}
        </div>
        <div class="site-footer__bottom">
            <span>&copy; {% assign _year = site.time | date: "%Y" %}{% include roman.html n=_year %} {{ site.authors.ricardorodrigues.name | default: site.title }}</span>
            <span>Written with Jekyll &middot; <a href="{{ site.url }}/admin/">Edited with Netlify CMS</a></span>
        </div>
    </div>
</footer>

<!DOCTYPE html>
<html lang="en">
<head>
    {% if site.analytics-google %}
        {% include analytics-google.html %}
    {% endif %}

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="{{ site.title | escape }}">
    {% if site.dark-theme == "auto" %}
        <meta name="color-scheme" content="light dark">
    {% endif %}

    {% seo %}

    {% include favicon.html %}

    <link rel="canonical" href="{{ site.url }}{{ page.url | replace:'index.html','' }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ site.url }}/feed.xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Grenze+Gotisch:wght@400&family=Inter:wght@500;600&family=JetBrains+Mono:wght@400&display=swap">
    <link rel="stylesheet" href="{{ site.url }}/assets/css/main.css">

    <script src="https://kit.fontawesome.com/1dc8156de7.js" crossorigin="anonymous"></script>

    {% if page.externalLink %}
        <meta http-equiv="refresh" content="0; URL='{{ page.externalLink }}'">
    {% endif %}
</head>
<body>
    {% include site-header.html %}

    <main id="content">
        {{ content }}
    </main>

    {% include footer.html %}

    <script>
        /* Markdown images with a title, alone in their paragraph, become a figure with a caption. */
        document.querySelectorAll(".prose p > img[title]:only-child").forEach(function (img) {
            var p = img.parentElement;
            if (p.textContent.trim() !== "") { return; }
            var figure = document.createElement("figure");
            var caption = document.createElement("figcaption");
            caption.textContent = img.getAttribute("title");
            p.replaceWith(figure);
            figure.appendChild(img);
            figure.appendChild(caption);
        });

        /* The illuminated initial: wrap the first letter of the opening paragraph in a span.
           An image alone at the top (or its figure) is skipped; anything else means no initial. */
        document.querySelectorAll(".prose, .hero__bio").forEach(function (box) {
            var p = null;
            for (var el = box.firstElementChild; el; el = el.nextElementSibling) {
                var onlyImage = el.tagName === "P" && el.children.length === 1 && el.firstElementChild.tagName === "IMG" && el.textContent.trim() === "";
                if (el.tagName === "FIGURE" || onlyImage) { continue; }
                if (el.tagName === "P") { p = el; }
                break;
            }
            if (!p) { return; }
            var walker = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
            var node = walker.nextNode();
            while (node && node.nodeValue.trim() === "") { node = walker.nextNode(); }
            if (!node) { return; }
            var match = node.nodeValue.match(/^(\s*)([A-Za-z\u00C0-\u024F0-9])/);
            if (!match) { return; }
            var rest = node.splitText(match[1].length);
            rest.splitText(1);
            var initial = document.createElement("span");
            initial.className = "initial";
            initial.setAttribute("aria-hidden", "true");
            var letter = document.createElement("span");
            letter.textContent = rest.nodeValue;
            initial.appendChild(letter);
            rest.parentNode.insertBefore(initial, rest);
            p.classList.add("has-initial");
            var hidden = document.createElement("span");
            hidden.className = "visually-hidden";
            hidden.textContent = rest.nodeValue;
            rest.parentNode.replaceChild(hidden, rest);
        });
    </script>
</body>
</html>
